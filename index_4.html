<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agora em Dois Vizinhos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap">
<style>
  :root{
    --ink: #ffffff;
    --ink-dim: rgba(255,255,255,.70);
    --ink-faint: rgba(255,255,255,.42);
    --glass: rgba(255,255,255,.09);
    --glass-border: rgba(255,255,255,.16);
    --shadow: rgba(4,8,22,.35);
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:#060a16;
    color:var(--ink);
    font-family:'Manrope', -apple-system, 'SF Pro Display', 'Segoe UI', sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  .stage{
    position:relative;
    width:100vw;
    height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    align-items:center;
    padding: 6vh 7vw 4vh;
    text-align:center;
    isolation:isolate;
    transition: background 1.4s ease;
  }

  /* ---- sky backgrounds, keyed by time-of-day + condition ---- */
  .stage{ background: linear-gradient(180deg, #0a1230 0%, #131b3f 55%, #1c2550 100%); }
  .stage.is-night.cond-clear{ background: linear-gradient(180deg, #05070f 0%, #0d1230 45%, #1a1f45 100%); }
  .stage.is-night.cond-cloudy{ background: linear-gradient(180deg, #0a0c12 0%, #171b28 55%, #23283a 100%); }
  .stage.is-day.cond-clear{ background: linear-gradient(180deg, #1c6fe0 0%, #4c9aef 48%, #a9dcf7 100%); }
  .stage.is-day.cond-cloudy{ background: linear-gradient(180deg, #4f7096 0%, #7996b3 55%, #b7c7d6 100%); }
  .stage.is-day.cond-rain{ background: linear-gradient(180deg, #2c3c54 0%, #445872 55%, #6f8296 100%); }
  .stage.is-night.cond-rain{ background: linear-gradient(180deg, #04060a 0%, #0e1420 55%, #182231 100%); }

  /* ambient stars, shown only at night */
  .sky-fx{
    position:absolute; inset:0; overflow:hidden; z-index:0; pointer-events:none;
  }
  .stars{
    position:absolute; inset:0;
    background-image:
      radial-gradient(1.6px 1.6px at 12% 18%, #fff 100%, transparent 100%),
      radial-gradient(1.2px 1.2px at 26% 8%, #fff 100%, transparent 100%),
      radial-gradient(1.8px 1.8px at 40% 22%, #fff 100%, transparent 100%),
      radial-gradient(1.2px 1.2px at 62% 6%, #fff 100%, transparent 100%),
      radial-gradient(1.6px 1.6px at 78% 16%, #fff 100%, transparent 100%),
      radial-gradient(1.2px 1.2px at 90% 26%, #fff 100%, transparent 100%),
      radial-gradient(1.4px 1.4px at 8% 34%, #fff 100%, transparent 100%),
      radial-gradient(1.2px 1.2px at 55% 30%, #fff 100%, transparent 100%);
    opacity:0;
    transition: opacity 1.6s ease;
  }
  .is-night .stars{ opacity:.55; animation: twinkle 5s ease-in-out infinite; }
  @keyframes twinkle{ 0%,100%{opacity:.35} 50%{opacity:.75} }

  main{
    position:relative; z-index:1;
    display:flex; flex-direction:column; align-items:center;
    width:100%;
  }

  /* ---- header: place + date ---- */
  .place{
    font-size: clamp(0.78rem, 3.6vw, 1rem);
    font-weight:700;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--ink);
    margin:0 0 .55rem;
  }
  .place span{ color:var(--ink-dim); font-weight:600; }

  .date{
    font-size: clamp(0.95rem, 4vw, 1.15rem);
    font-weight:500;
    color:var(--ink-dim);
    margin:0;
  }

  /* ---- clock ---- */
  .clock-wrap{
    display:flex; flex-direction:column; align-items:center;
    gap:.4rem;
  }
  .clock{
    font-size: clamp(3.6rem, 18vw, 6.4rem);
    font-weight:800;
    line-height:1;
    letter-spacing:-.02em;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 6px 30px var(--shadow);
  }
  .clock .colon{ transition:opacity .15s ease; }
  .clock .colon.dim{ opacity:.22; }
  .seconds{
    font-size: clamp(.85rem, 3.2vw, 1rem);
    font-weight:600;
    color:var(--ink-faint);
    font-variant-numeric: tabular-nums;
    letter-spacing:.05em;
  }

  /* ---- weather card ---- */
  .weather-card{
    width:100%;
    background: var(--glass);
    border:1px solid var(--glass-border);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    backdrop-filter: blur(22px) saturate(140%);
    border-radius: 28px;
    padding: 1.5rem 1.4rem 1.3rem;
    box-shadow: 0 20px 50px var(--shadow);
  }

  .wx-top{
    display:flex; align-items:center; justify-content:center; gap:1rem;
  }
  .wx-icon{ width:52px; height:52px; flex:none; }
  .wx-icon svg{ width:100%; height:100%; display:block; }

  .wx-temp{
    font-size: clamp(2.4rem, 11vw, 3.4rem);
    font-weight:800;
    letter-spacing:-.02em;
    font-variant-numeric: tabular-nums;
    line-height:1;
  }
  .wx-temp sup{ font-size:.42em; font-weight:700; vertical-align:.5em; margin-left:.06em; color:var(--ink-dim); }

  .wx-cond{
    margin:.55rem 0 0;
    font-size: clamp(.95rem, 3.8vw, 1.08rem);
    font-weight:600;
    color:var(--ink-dim);
  }

  .wx-divider{
    height:1px;
    background:var(--glass-border);
    margin: 1.05rem 0;
    border:none;
  }

  .wx-stats{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:.6rem;
  }
  .wx-stat{ display:flex; flex-direction:column; gap:.2rem; }
  .wx-stat .k{
    font-size:.62rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
    color:var(--ink-faint);
  }
  .wx-stat .v{
    font-size:.98rem; font-weight:700; color:var(--ink);
    font-variant-numeric: tabular-nums;
  }

  footer{
    position:relative; z-index:1;
    font-size:.72rem;
    font-weight:600;
    letter-spacing:.04em;
    color:var(--ink-faint);
  }

  @media (prefers-reduced-motion: reduce){
    .stars{ animation:none; }
    *{ transition-duration:.01ms !important; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="sky-fx"><div class="stars"></div></div>

  <main>
    <p class="place">Dois Vizinhos <span>· PR</span></p>
    <p class="date" id="date">—</p>
  </main>

  <div class="clock-wrap">
    <div class="clock" id="clock">--<span class="colon">:</span>--</div>
    <div class="seconds" id="seconds">00 s</div>
  </div>

  <div class="weather-card">
    <div class="wx-top">
      <div class="wx-icon" id="wxIcon"></div>
      <div class="wx-temp" id="wxTemp">--<sup>°C</sup></div>
    </div>
    <p class="wx-cond" id="wxCond">—</p>
    <hr class="wx-divider" />
    <div class="wx-stats">
      <div class="wx-stat"><span class="k">Sensação</span><span class="v" id="wxFeels">--°</span></div>
      <div class="wx-stat"><span class="k">Máx / Mín</span><span class="v" id="wxMinMax">--° / --°</span></div>
      <div class="wx-stat"><span class="k">Umidade</span><span class="v" id="wxHumidity">--%</span></div>
    </div>
  </div>

  <footer id="footer">atualizado —</footer>
</div>

<script>
  // Coordinates: Dois Vizinhos, PR, Brasil
  const LAT = -25.73361, LON = -53.05722;
  const TZ = "America/Sao_Paulo";

  // Snapshot shown instantly on load, replaced by live data from Open-Meteo
  // (no API key needed) moments later, then refreshed every 20 minutes.
  const WEATHER = {
    tempC: 28,
    feelsLikeC: 27,
    condition: "clear", // clear | cloudy | rain | storm | snow
    conditionLabel: "Céu limpo",
    humidity: 45,
    windKmh: 7,
    maxC: 31,
    minC: 20,
    sunrise: "06:48",
    sunset: "18:18",
    isDay: null, // filled in by the API (1/0); null = fall back to sunrise/sunset math
    updatedAt: "2026-08-28T19:32:00-03:00"
  };

  const stage = document.getElementById('stage');

  const ICONS = {
    'day-clear': '<svg viewBox="0 0 64 64" fill="none" stroke="#ffe08a" stroke-width="3" stroke-linecap="round"><circle cx="32" cy="32" r="12" fill="#ffe08a" stroke="none"/><g>' +
      [0,45,90,135,180,225,270,315].map(a=>`<line x1="32" y1="6" x2="32" y2="14" transform="rotate(${a} 32 32)"/>`).join('') + '</g></svg>',
    'night-clear': '<svg viewBox="0 0 64 64" fill="none"><path d="M40 12c-11 2-19 12-19 23 0 13 10.5 23.5 23.5 23.5 6.5 0 12.4-2.6 16.7-6.8-2 .5-4 .8-6.2.8-13.3 0-24-10.7-24-24 0-6 2.2-11.4 5.9-15.6-.5-.3-1.3-.6-1.9-.9z" fill="#ffe9b8"/><circle cx="16" cy="14" r="1.4" fill="#fff"/><circle cx="10" cy="24" r="1" fill="#fff"/><circle cx="20" cy="26" r="1.2" fill="#fff"/></svg>',
    'day-cloudy': '<svg viewBox="0 0 64 64" fill="none"><circle cx="24" cy="24" r="9" fill="#ffe08a"/><path d="M18 44c-6 0-11-4.8-11-10.7 0-5.4 4.1-9.9 9.5-10.6C18 17.3 23 13 29 13c6.6 0 12 5.2 12.4 11.7 5.6.6 9.9 5.2 9.9 10.8 0 5.9-5 10.5-11.3 10.5H18z" fill="#f4f7fb"/></svg>',
    'night-cloudy': '<svg viewBox="0 0 64 64" fill="none"><path d="M22 20c-7 1.5-12 7.6-12 14.8 0 .8 0 1.6.2 2.4C8 38.6 6 41.9 6 45.7 6 51.4 10.9 56 17 56h27c6.6 0 12-5 12-11.2 0-5.9-5-10.7-11.3-11.1C43.9 25.9 38.3 21 31.6 21c-1.1 0-2.2.1-3.2.4-1.8-.9-3.9-1.4-6.4-1.4z" fill="#c9d2e6"/><circle cx="46" cy="14" r="6" fill="#e9edf7"/></svg>',
    'rain': '<svg viewBox="0 0 64 64" fill="none"><path d="M18 38c-6 0-11-4.8-11-10.7 0-5.4 4.1-9.9 9.5-10.6C18 11.3 23 7 29 7c6.6 0 12 5.2 12.4 11.7 5.6.6 9.9 5.2 9.9 10.8 0 5.9-5 10.5-11.3 10.5H18z" fill="#d7dee8"/><g stroke="#8fd0ff" stroke-width="3" stroke-linecap="round"><line x1="20" y1="46" x2="16" y2="56"/><line x1="32" y1="46" x2="28" y2="56"/><line x1="44" y1="46" x2="40" y2="56"/></g></svg>',
    'storm': '<svg viewBox="0 0 64 64" fill="none"><path d="M18 34c-6 0-11-4.8-11-10.7 0-5.4 4.1-9.9 9.5-10.6C18 7.3 23 3 29 3c6.6 0 12 5.2 12.4 11.7 5.6.6 9.9 5.2 9.9 10.8 0 5.9-5 10.5-11.3 10.5H18z" fill="#aab4c9"/><path d="M34 30l-8 14h7l-4 13 13-18h-8l6-9z" fill="#ffd36a"/></svg>',
    'snow': '<svg viewBox="0 0 64 64" fill="none"><path d="M18 34c-6 0-11-4.8-11-10.7 0-5.4 4.1-9.9 9.5-10.6C18 7.3 23 3 29 3c6.6 0 12 5.2 12.4 11.7 5.6.6 9.9 5.2 9.9 10.8 0 5.9-5 10.5-11.3 10.5H18z" fill="#e4e9f3"/><g stroke="#bfe3ff" stroke-width="2.4" stroke-linecap="round"><path d="M20 44v10M15 49h10"/><path d="M32 46v10M27 51h10"/><path d="M44 44v10M39 49h10"/></g></svg>'
  };

  const WMO = {
    0:['clear','Céu limpo'], 1:['clear','Predominantemente limpo'],
    2:['cloudy','Parcialmente nublado'], 3:['cloudy','Nublado'],
    45:['cloudy','Neblina'], 48:['cloudy','Neblina com geada'],
    51:['rain','Garoa fraca'], 53:['rain','Garoa'], 55:['rain','Garoa forte'],
    56:['rain','Garoa congelante'], 57:['rain','Garoa congelante forte'],
    61:['rain','Chuva fraca'], 63:['rain','Chuva'], 65:['rain','Chuva forte'],
    66:['rain','Chuva congelante'], 67:['rain','Chuva congelante forte'],
    71:['snow','Neve fraca'], 73:['snow','Neve'], 75:['snow','Neve forte'], 77:['snow','Granizo de neve'],
    80:['rain','Pancadas de chuva'], 81:['rain','Pancadas de chuva'], 82:['rain','Pancadas de chuva fortes'],
    85:['snow','Pancadas de neve'], 86:['snow','Pancadas de neve fortes'],
    95:['storm','Trovoada'], 96:['storm','Trovoada com granizo'], 99:['storm','Trovoada forte']
  };

  function codeToCondition(code){
    const hit = WMO[code];
    return hit ? { bucket: hit[0], label: hit[1] } : { bucket:'cloudy', label:'—' };
  }

  function pad(n){ return String(n).padStart(2,'0'); }

  function minutesOf(hhmm){
    const [h,m] = hhmm.split(':').map(Number);
    return h*60+m;
  }

  function partsInTZ(date){
    const fmt = new Intl.DateTimeFormat('pt-BR', { timeZone: TZ, hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false });
    const parts = Object.fromEntries(fmt.formatToParts(date).map(p=>[p.type,p.value]));
    return { hour:+parts.hour, minute:+parts.minute, second:+parts.second };
  }

  function isDaytime(nowParts){
    if (WEATHER.isDay === 1 || WEATHER.isDay === true) return true;
    if (WEATHER.isDay === 0 || WEATHER.isDay === false) return false;
    const nowMin = nowParts.hour*60 + nowParts.minute;
    return nowMin >= minutesOf(WEATHER.sunrise) && nowMin < minutesOf(WEATHER.sunset);
  }

  function renderWeather(){
    const day = isDaytime(partsInTZ(new Date()));
    const gradientBucket = WEATHER.condition === 'clear' ? 'clear'
      : (WEATHER.condition === 'cloudy' ? 'cloudy' : 'rain'); // rain/storm/snow share the moody gradient

    stage.classList.toggle('is-day', day);
    stage.classList.toggle('is-night', !day);
    stage.classList.remove('cond-clear','cond-cloudy','cond-rain');
    stage.classList.add('cond-' + gradientBucket);

    let iconKey;
    if (WEATHER.condition === 'storm') iconKey = 'storm';
    else if (WEATHER.condition === 'snow') iconKey = 'snow';
    else if (WEATHER.condition === 'rain') iconKey = 'rain';
    else if (WEATHER.condition === 'cloudy') iconKey = day ? 'day-cloudy' : 'night-cloudy';
    else iconKey = day ? 'day-clear' : 'night-clear';
    document.getElementById('wxIcon').innerHTML = ICONS[iconKey];

    document.getElementById('wxTemp').innerHTML = Math.round(WEATHER.tempC) + '<sup>°C</sup>';
    document.getElementById('wxCond').textContent = WEATHER.conditionLabel;
    document.getElementById('wxFeels').textContent = Math.round(WEATHER.feelsLikeC) + '°';
    document.getElementById('wxMinMax').textContent = Math.round(WEATHER.maxC) + '° / ' + Math.round(WEATHER.minC) + '°';
    document.getElementById('wxHumidity').textContent = Math.round(WEATHER.humidity) + '%';

    const upd = new Date(WEATHER.updatedAt);
    const uParts = partsInTZ(upd);
    document.getElementById('footer').textContent = 'atualizado às ' + pad(uParts.hour) + ':' + pad(uParts.minute);
  }

  function renderClock(){
    const now = new Date();
    const p = partsInTZ(now);

    document.getElementById('clock').innerHTML =
      pad(p.hour) + '<span class="colon' + (p.second % 2 ? ' dim' : '') + '">:</span>' + pad(p.minute);
    document.getElementById('seconds').textContent = pad(p.second) + ' s';

    const fmtDate = new Intl.DateTimeFormat('pt-BR', {
      timeZone: TZ, weekday:'long', day:'numeric', month:'long'
    });
    const dateStr = fmtDate.format(now);
    document.getElementById('date').textContent = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
  }

  async function fetchWeather(){
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}` +
      `&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m` +
      `&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset&timezone=${encodeURIComponent(TZ)}&forecast_days=1`;
    try{
      const res = await fetch(url, { cache: 'no-store' });
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const { bucket, label } = codeToCondition(data.current.weather_code);

      WEATHER.tempC = data.current.temperature_2m;
      WEATHER.feelsLikeC = data.current.apparent_temperature;
      WEATHER.humidity = data.current.relative_humidity_2m;
      WEATHER.windKmh = data.current.wind_speed_10m;
      WEATHER.condition = bucket;
      WEATHER.conditionLabel = label;
      WEATHER.maxC = data.daily.temperature_2m_max[0];
      WEATHER.minC = data.daily.temperature_2m_min[0];
      WEATHER.sunrise = data.daily.sunrise[0].slice(11,16);
      WEATHER.sunset = data.daily.sunset[0].slice(11,16);
      WEATHER.isDay = data.current.is_day;
      WEATHER.updatedAt = new Date().toISOString();

      renderWeather();
    }catch(err){
      // Sem rede ou API fora do ar: mantém os últimos dados conhecidos na tela.
      console.warn('Não foi possível atualizar o clima agora.', err);
    }
  }

  renderWeather();
  renderClock();
  fetchWeather();
  setInterval(renderClock, 1000);
  setInterval(renderWeather, 60000);      // reavalia dia/noite a cada minuto
  setInterval(fetchWeather, 20 * 60000);  // busca clima novo a cada 20 minutos
</script>

</body>
</html>
